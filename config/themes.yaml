# ---------------------------------------------------------------------------
# Who actually trades on a piece of news.
#
# A headline names the buyer — "Power Grid secures 6,000 MW Barmer HVDC project" — but POWERGRID is
# a ₹3 lakh crore utility that will not move on a capex plan. The names that move are the ones that
# *supply* the thing. This file is that map, and it is the system's domain knowledge: every story
# that teaches it something should be added here rather than encoded in Python.
#
# Each theme carries:
#   match        keywords in the article that put a story in this theme (lowercase, substring)
#   require      optional: at least one of these must also appear, to keep "solar" out of a story
#                about solar eclipses
#   plays        the NSE symbols that trade on it, each with:
#                  weight   1.0 = the direct supplier, 0.5 = a credible second-order name.
#                           This becomes the `directness` term in the catalyst score, so a
#                           second-order name needs a bigger event to clear the same bar.
#                  why      one line, shown on the page — the reader must be able to disagree
#   cost_per     optional: turns a capacity figure into a rupee estimate when the announcement
#                gives none. `unit` is the capacity unit as written; `inr_cr` is crore per unit.
#                These are order-of-magnitude public figures, and the score says "estimated" when
#                it uses one.
#   buyers       names that appear as the *awarding* party in this theme. A story is not a buy
#                signal for the buyer, and listing them here stops the buyer being scored as the
#                beneficiary of its own capex.
# ---------------------------------------------------------------------------

themes:
  - id: hvdc
    name: HVDC transmission
    match: ["hvdc", "high voltage direct current", "lcc terminal", "converter station",
            "bipole", "±800 kv", "800 kv", "synchronous condenser"]
    cost_per: {unit: MW, inr_cr: 2.1, note: "±800 kV LCC terminal station, supply + execution"}
    buyers: [POWERGRID, NTPC, SJVN, NHPC, ADANIENSOL]
    plays:
      - {symbol: "GVT&D", weight: 1.0, why: "one of two Indian HVDC terminal suppliers with a local LCC line"}
      - {symbol: POWERINDIA, weight: 1.0, why: "Hitachi Energy — the other HVDC terminal supplier"}
      - {symbol: SIEMENS, weight: 0.5, why: "grid technology arm bids HVDC and HVAC substations"}
      - {symbol: ENRIN, weight: 0.5, why: "Siemens Energy India — transmission products into the same projects"}
      - {symbol: ABB, weight: 0.4, why: "electrification and automation content in converter stations"}

  - id: transmission_epc
    name: Transmission lines and substations
    match: ["transmission line", "substation", "sub-station", "ehv", "765 kv", "400 kv",
            "transmission system", "tbcb", "inter-state transmission"]
    cost_per: {unit: km, inr_cr: 1.6, note: "765 kV double-circuit line, turnkey"}
    buyers: [POWERGRID, ADANIENSOL, NTPC]
    plays:
      - {symbol: KPIL, weight: 1.0, why: "Kalpataru Projects — transmission EPC order book"}
      - {symbol: KEC, weight: 1.0, why: "KEC International — transmission towers and turnkey lines"}
      - {symbol: TARIL, weight: 0.8, why: "Transformers and Rectifiers — power transformers into substations"}
      - {symbol: APARINDS, weight: 0.7, why: "conductors and cables for EHV lines"}
      - {symbol: SKIPPER, weight: 0.6, why: "transmission towers and structures"}
      - {symbol: POWERINDIA, weight: 0.5, why: "substation automation and switchgear"}

  - id: power_cables
    name: Cables and wires
    match: ["cable", "conductor", "wire harness", "ehv cable", "elastomeric"]
    plays:
      - {symbol: POLYCAB, weight: 1.0, why: "largest listed cables and wires maker"}
      - {symbol: KEI, weight: 1.0, why: "EHV cables and house wire"}
      - {symbol: RRKABEL, weight: 0.8, why: "wires and cables, retail-led"}
      - {symbol: APARINDS, weight: 0.8, why: "conductors, speciality oils, cables"}
      - {symbol: FINCABLES, weight: 0.7, why: "Finolex Cables"}

