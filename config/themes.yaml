      - {symbol: BEL, weight: 1.0, why: "radars, electronic warfare, missile electronics"}
      - {symbol: BDL, weight: 1.0, why: "missiles and torpedoes"}
      - {symbol: MAZDOCK, weight: 1.0, why: "warships and submarines"}
      - {symbol: COCHINSHIP, weight: 0.9, why: "shipbuilding and repair"}
      - {symbol: GRSE, weight: 0.9, why: "Garden Reach — warships"}
      - {symbol: SOLARINDS, weight: 0.8, why: "defence explosives and ammunition"}
      - {symbol: DATAPATTNS, weight: 0.8, why: "defence electronics"}
      - {symbol: PARAS, weight: 0.7, why: "Paras Defence — optics and drones"}
      - {symbol: ZENTEC, weight: 0.6, why: "simulators and training systems"}
      - {symbol: BEML, weight: 0.6, why: "defence mobility and rail products"}

  - id: railways
    name: Railway orders
    match: ["indian railways", "railway board", "vande bharat", "rvnl", "dedicated freight corridor",
            "kavach", "metro rail", "rolling stock", "wagon"]
