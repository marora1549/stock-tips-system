- id: brokerage_gnews
  name: Brokerage calls (Motilal, ICICI Direct, HDFC Sec, Axis, Kotak, Angel One, Nuvama, Emkay…)
  kind: gnews
  query: ("Motilal Oswal" OR "ICICI Direct" OR "HDFC Securities" OR "Axis Securities" OR "Kotak" OR "Sharekhan" OR "Angel One" OR "Nuvama" OR "Emkay" OR "Anand Rathi" OR "Choice") ("buy" OR "target price")
    stock
  publisher: ''
  category: brokerage
  enabled: true
- id: chartink_52w_breakout
  name: Chartink — 52-week-high breakout with 1.5x volume
  kind: chartink
  clause: ( {cash} ( latest close > latest max( 250 , latest high ) * 0.99 and latest volume > latest sma( latest volume , 20 ) * 1.5 and latest close > 50 and latest sma( latest volume , 20 ) * latest
    close > 50000000 ) )
  default_timeframe: weekly
  category: screener
  enabled: true
- id: chartink_ema_pullback
  name: Chartink — pullback to 20 EMA in strong uptrend
  kind: chartink
  clause: ( {cash} ( latest ema( latest close , 20 ) > latest ema( latest close , 50 ) and latest ema( latest close , 50 ) > latest ema( latest close , 200 ) and latest low <= latest ema( latest close ,
    20 ) * 1.02 and latest close >= latest ema( latest close , 20 ) * 0.99 and latest rsi( 14 ) > 45 and latest rsi( 14 ) < 62 and latest sma( latest volume , 20 ) * latest close > 50000000 ) )
  default_timeframe: weekly
  category: screener
  enabled: true
- id: chartink_squeeze
  name: Chartink — Bollinger squeeze (pre-breakout consolidation)
  kind: chartink
  clause: ( {cash} ( latest upper bollinger band( 20 , 2 ) / latest lower bollinger band( 20 , 2 ) < 1.08 and latest close > latest ema( latest close , 200 ) and latest sma( latest volume , 20 ) * latest
    close > 50000000 ) )
  default_timeframe: monthly
  category: screener
  enabled: true
- id: chartink_rsi_oversold_bounce
  name: Chartink — RSI oversold bounce with volume confirmation
  kind: chartink
  category: screener
  enabled: true
  clause: ( {cash} ( latest rsi( 14 ) > 30 and 1 day ago rsi( 14 ) <= 30 and latest close > 1 day ago close and latest volume > latest sma( latest volume , 20 ) * 1.2 and latest sma( latest volume , 20
    ) * latest close > 50000000 ) )
  default_timeframe: weekly
