<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalal Street Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fbfbfd; --border:#e2e4ea;
  --text:#14161c; --muted:#5b616f; --muted-2:#868c99;
  --accent:#2563eb; --green:#0a8f4a; --red:#d64545; --amber:#b3790a;
  --chip-bg:#eef1f6; --shadow:0 1px 3px rgba(20,22,28,.06);
  --badge-buy-bg:#e4f6ea; --badge-buy-fg:#0a7a3f;
  --badge-hold-bg:#eef1f6; --badge-hold-fg:#4a5063;
  --badge-avoid-bg:#fbe9e9; --badge-avoid-fg:#b23c3c;
  --track:#e6e8ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171922; --panel-2:#1c1f29; --border:#2a2e3a;
    --text:#e7e9ee; --muted:#a2a8b8; --muted-2:#767c8c;
    --accent:#5b8def; --green:#3fcf82; --red:#f2685f; --amber:#e0ac4a;
    --chip-bg:#232633; --shadow:0 1px 3px rgba(0,0,0,.35);
    --badge-buy-bg:#0f2e1e; --badge-buy-fg:#4bd98a;
    --badge-hold-bg:#232633; --badge-hold-fg:#b7bdcc;
    --badge-avoid-bg:#341717; --badge-avoid-fg:#f2857e;
    --track:#262a36;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3,h4{font-weight:650;margin:0}
.section{margin-top:34px}
.section h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
/* header */
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding-top:8px}
header.top h1{font-size:22px}
.gendate{color:var(--muted-2);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);margin-bottom:4px}
.tile .value{font-size:19px;font-weight:650}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
/* picks cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{padding:14px 16px}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .sym{font-size:17px;font-weight:700}
.card .company{font-size:12px;color:var(--muted);margin-top:1px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.badge.buy{background:var(--badge-buy-bg);color:var(--badge-buy-fg)}
.badge.hold{background:var(--badge-hold-bg);color:var(--badge-hold-fg)}
.badge.avoid,.badge.sell{background:var(--badge-avoid-bg);color:var(--badge-avoid-fg)}
.composite-big{font-size:26px;font-weight:750;margin-top:8px}
.composite-big span{font-size:12px;color:var(--muted-2);font-weight:500}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--chip-bg);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--muted)}
.chip b{color:var(--text)}
.planline{margin-top:10px;font-size:12.5px;color:var(--text);line-height:1.6;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.bucket{margin-top:8px;font-size:11.5px;color:var(--muted-2);font-style:italic}
.srcline{margin-top:6px;font-size:11px;color:var(--muted-2)}
.alloc{margin-top:8px;font-size:12px;color:var(--accent);font-weight:600}
.watchline{margin-top:14px;font-size:12.5px;color:var(--muted)}
.watchline b{color:var(--text)}
/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted-2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
tbody tr:hover{background:var(--panel-2)}
.empty-msg{padding:22px 16px;color:var(--muted);text-align:center}
.dots{letter-spacing:2px;font-size:13px}
.dots .on{color:var(--green)}
.dots .off{color:var(--track)}
.bar-track{position:relative;width:100px;height:8px;background:var(--track);border-radius:5px;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.legend-note{font-size:11.5px;color:var(--muted-2);margin-top:10px;padding:0 2px}
.outcome{font-size:11px;font-weight:700;padding:2px 7px;border-radius:14px;text-transform:uppercase}
.outcome.win{background:var(--badge-buy-bg);color:var(--badge-buy-fg)}
.outcome.loss{background:var(--badge-avoid-bg);color:var(--badge-avoid-fg)}
.outcome.neutral{background:var(--badge-hold-bg);color:var(--badge-hold-fg)}
.disabled-row{opacity:.45}
/* buttons + actions */
.btn{font:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);padding:4px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--border);color:var(--muted)}
.btn.small{padding:4px 9px;font-size:11.5px}
/* room / capacity line */
.roomline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.roomline .pill{background:var(--chip-bg);border-radius:8px;padding:4px 9px}
.roomline .pill b{color:var(--text)}
.roomline .full{background:var(--badge-avoid-bg);color:var(--badge-avoid-fg);font-weight:600}
/* level tables */
table.levels{min-width:980px}
table.levels th.grp{text-align:center;border-bottom:none;padding-bottom:2px}
td.lvl{font-variant-numeric:tabular-nums;text-align:right}
td.lvl .p{display:block;font-size:10.5px;color:var(--muted-2);line-height:1.25}
td.stopcell{background:color-mix(in srgb, var(--red) 9%, transparent);border-left:2px solid var(--red)}
td.stopcell .v{color:var(--red);font-weight:600}
td.tgtcell{background:color-mix(in srgb, var(--green) 7%, transparent)}
td.tgtcell.t1{border-left:2px solid color-mix(in srgb, var(--green) 45%, transparent)}
td.tgtcell .v{font-weight:600}
td.tgtcell.hit .v{color:var(--green)}
td.tgtcell.hit:after{content:' ✔';color:var(--green);font-size:11px}
td.entrycell{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.said{font-size:11.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.rr{font-variant-numeric:tabular-nums}
.rr.weak{color:var(--amber)}
.status-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:2px 7px;border-radius:12px}
.status-pill.pending{background:var(--badge-hold-bg);color:var(--badge-hold-fg)}
.status-pill.open{background:var(--badge-buy-bg);color:var(--badge-buy-fg)}
.status-pill.hold{background:var(--chip-bg);color:var(--amber)}
.status-pill.queued{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent)}
/* booking queue */
.queue{margin-top:12px}
.queue-card{padding:12px 14px;margin-top:10px}
.queue-card .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.queue-card .qsym{font-weight:700;font-size:15px}
.cmd{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.cmd code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);overflow-x:auto;white-space:pre;flex:1}
.hint{font-size:11.5px;color:var(--muted-2);margin-top:8px;line-height:1.6}
/* chart */
.chartbox{padding:16px;height:300px}
/* collapsible */
details.panel{padding:0}
details.panel>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary:after{content:'▸';color:var(--muted-2);transition:transform .15s}
details.panel[open]>summary:after{transform:rotate(90deg)}
details.panel .tablewrap{border-top:1px solid var(--border)}
/* lessons */
.lessons{padding:16px 18px;font-size:13px}
.lessons h4{margin:14px 0 6px;font-size:14px}
.lessons h4:first-child{margin-top:0}
.lessons p{margin:6px 0;color:var(--text)}
.lessons table{margin:10px 0}
.lessons td,.lessons th{white-space:normal}
/* footer */
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted-2);font-size:11.5px;line-height:1.7}
.err-box{margin:40px auto;max-width:520px;text-align:center;padding:28px;color:var(--red)}
.pos{color:var(--green)} .neg{color:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1>Dalal Street Desk — paper book</h1>
    <div class="gendate" id="genDate"></div>
  </header>
  <div class="tiles" id="tiles"></div>

  <div class="section" id="suggestionsSection">
    <h2>Suggestions <span id="sugCount" style="font-weight:400;color:var(--muted-2);text-transform:none;letter-spacing:0"></span></h2>
    <div class="roomline" id="bookRoom"></div>
    <div id="sugCards"></div>
    <div class="panel tablewrap" id="sugTable" style="margin-top:12px"></div>
    <div class="watchline" id="watchLine"></div>
    <div class="hint" id="sugHint"></div>
  </div>

  <div class="section" id="activeSection">
    <h2>Active investments <span id="activeCount" style="font-weight:400;color:var(--muted-2);text-transform:none;letter-spacing:0"></span></h2>
    <div class="panel tablewrap" id="activeTable"></div>
    <div class="queue" id="queuePanel"></div>
  </div>

  <div class="section">
    <h2>Equity curve</h2>
    <div class="panel chartbox"><canvas id="equityChart"></canvas></div>
  </div>

  <div class="section">
    <h2>Source confidence</h2>
    <div class="panel tablewrap" id="sourceTable"></div>
    <div class="legend-note">50 = untested; every source starts here.</div>
  </div>

  <div class="section">
    <h2>Closed trades <span style="font-weight:400;color:var(--muted-2)">(last 50)</span></h2>
    <div class="panel tablewrap" id="closedTable"></div>
  </div>

  <div class="section">
    <details class="panel" id="analysedDetails">
      <summary>All analysed today <span id="analysedCount" style="color:var(--muted-2);font-weight:400"></span></summary>
      <div class="tablewrap" id="analysedTable"></div>
    </details>
  </div>

  <div class="section">
    <h2>Lessons journal</h2>
    <div class="panel lessons" id="lessons"></div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
// ---------- formatting helpers ----------
function inr(n, opts){
  opts = opts || {};
  if (n === null || n === undefined || isNaN(n)) return '—';
  var neg = n < 0; n = Math.abs(n);
  var decimals = opts.decimals !== undefined ? opts.decimals : 0;
  var fixed = n.toFixed(decimals);
  var parts = fixed.split('.');
  var intPart = parts[0], dec = parts[1];
  var last3 = intPart.slice(-3);
  var rest = intPart.slice(0, -3);
  if (rest !== '') last3 = ',' + last3;
  var grouped = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  var out = (opts.symbol === false ? '' : '₹') + grouped + (dec ? '.' + dec : '');
  return (neg ? '-' : '') + out;
}
function pct(n, decimals){
  if (n === null || n === undefined || isNaN(n)) return '—';
  decimals = decimals === undefined ? 2 : decimals;
  var s = (n > 0 ? '+' : '') + n.toFixed(decimals) + '%';
  return s;
}
function pctClass(n){
  if (n === null || n === undefined || isNaN(n)) return '';
  return n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
}
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtNum(n, decimals){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toFixed(decimals === undefined ? 2 : decimals);
}
function fmtDate(s){
  if (!s) return '—';
  return s;
}

// ---------- minimal markdown ----------
function mdToHtml(md){
  if (!md || !md.trim()) return '<p style="color:var(--muted)">No lessons recorded yet.</p>';
  var lines = md.replace(/\r\n/g,'\n').split('\n');
  var html = [], i = 0;
  function inline(t){
    t = esc(t);
    t = t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
    return t;
  }
  while (i < lines.length){
    var line = lines[i];
    if (!line.trim()){ i++; continue; }
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){ html.push('<h4>' + inline(h[2]) + '</h4>'); i++; continue; }
    if (/^\|.*\|\s*$/.test(line)){
      var rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i]); i++;
      }
      if (rows.length && /^\|?[\s:|-]+\|?$/.test(rows[1] || '')) rows.splice(1,1);
      var t = '<table><tbody>';
      rows.forEach(function(r, ri){
        var cells = r.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
        var tag = ri === 0 ? 'th' : 'td';
        t += '<tr>' + cells.map(function(c){return '<' + tag + '>' + inline(c) + '</' + tag + '>';}).join('') + '</tr>';
      });
      t += '</tbody></table>';
      html.push(t);
      continue;
    }
    if (/^[-*]\s+/.test(line)){
      var items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])){
        items.push('<li>' + inline(lines[i].replace(/^[-*]\s+/,'')) + '</li>');
        i++;
      }
      html.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    var para = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s/.test(lines[i]) && !/^\|.*\|\s*$/.test(lines[i]) && !/^[-*]\s+/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    html.push('<p>' + inline(para.join(' ')) + '</p>');
  }
  return html.join('\n');
}

// ---------- rendering ----------
function badgeClass(verdict){
  verdict = (verdict || '').toLowerCase();
  if (verdict.indexOf('buy') !== -1) return 'buy';
  if (verdict.indexOf('avoid') !== -1 || verdict.indexOf('sell') !== -1) return 'avoid';
  return 'hold';
}
function outcomeClass(outcome){
  outcome = (outcome || '').toLowerCase();
  if (outcome.indexOf('stop') !== -1 || outcome.indexOf('loss') !== -1) return 'loss';
  if (outcome.indexOf('t1') !== -1 || outcome.indexOf('t2') !== -1 || outcome.indexOf('t3') !== -1 || outcome.indexOf('gain') !== -1) return 'win';
  return 'neutral';
}
function renderTiles(stats){
  var t = document.getElementById('tiles');
  var retClass = pctClass(stats.return_pct);
  var win = (stats.win_rate === null || stats.win_rate === undefined) ? '—' : (stats.win_rate).toFixed(0) + '%';
  var tiles = [
    {label:'Equity', value: inr(stats.equity), sub: '<span class="' + retClass + '">' + pct(stats.return_pct) + '</span> vs capital ' + inr(stats.capital)},
    {label:'Cash', value: inr(stats.cash)},
    {label:'Open / Pending / Hold', value: stats.open + ' / ' + stats.pending + ' / ' + stats.hold},
    {label:'Closed · win rate', value: stats.closed + ' · ' + win, sub: (stats.avg_win_pct!=null||stats.avg_loss_pct!=null) ? ('avg win ' + pct(stats.avg_win_pct,1) + ' · avg loss ' + pct(stats.avg_loss_pct,1)) : ''},
    {label:'Realised P&L', value: '<span class="' + pctClass(stats.realised_inr) + '">' + inr(stats.realised_inr) + '</span>'}
  ];
  t.innerHTML = tiles.map(function(x){
    return '<div class="tile"><div class="label">' + x.label + '</div><div class="value">' + x.value + '</div>' +
      (x.sub ? '<div class="sub">' + x.sub + '</div>' : '') + '</div>';
  }).join('');
}

function planLine(plan){
  if (!plan) return '—';
  var t = plan.targets || [];
  var tp = plan.target_pct || [];
  var tstr = t.map(function(v,i){ return '₹' + fmtNum(v,2) + (tp[i]!=null ? ' (+' + tp[i].toFixed(1) + '%)' : ''); }).join(' / ');
  return 'Entry ₹' + fmtNum(plan.entry,2) + ' · SL ₹' + fmtNum(plan.stop_loss,2) +
    (plan.stop_loss_pct!=null ? ' (−' + plan.stop_loss_pct.toFixed(1) + '%)' : '') +
    ' · T1/T2/T3 ' + tstr +
    (plan.reward_risk_t2!=null ? ' · R:R ' + plan.reward_risk_t2.toFixed(2) : '') +
    (plan.timeframe ? ' · ' + plan.timeframe : '');
}

// ---------- booking queue (localStorage) ----------
// A GitHub Pages page cannot write state/ledger.json, so "Formalise" queues the
// trade locally, shows the exact CLI line that commits it to the ledger, and the
// queue entry self-clears once data.json comes back carrying that position.
var QKEY = 'stocktips.queue.v1';
var DATA = null;

function loadQueue(){
  try {
    var v = JSON.parse(localStorage.getItem(QKEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveQueue(q){
  try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {}
}
function reconcileQueue(positions){
  var held = {};
  (positions || []).forEach(function(p){ held[p.symbol] = true; });
  var q = loadQueue();
  var kept = q.filter(function(x){ return !held[x.symbol]; });
  if (kept.length !== q.length) saveQueue(kept);
  return kept;
}
function capacity(){
  var b = (DATA && DATA.book) || {};
  var q = loadQueue();
  var queuedCash = q.reduce(function(s, x){ return s + (x.capital || 0); }, 0);
  return {
    maxOpen: b.max_open_positions || 0,
    live: (b.open_or_pending || 0) + q.length,
    slots: Math.max(0, (b.slots_left || 0) - q.length),
    cash: Math.max(0, (b.deployable_cash || 0) - queuedCash),
    minAlloc: b.min_alloc_inr || 0,
    maxAlloc: b.max_alloc_inr || 0
  };
}
function orderLine(sym, qty, entry, stop, targets){
  var t = (targets || []).map(function(x){ return fmtNum(x, 2); }).join(' / ');
  return 'BUY ' + qty + ' ' + sym + ' NSE CNC limit ₹' + fmtNum(entry, 2) +
         ' · SL-M ₹' + fmtNum(stop, 2) + ' · GTT ₹' + t;
}
function bookCmd(x){
  return 'PYTHONPATH=src python -m stocktips book ' + x.symbol + ' --capital ' + Math.round(x.capital);
}
function copyText(text, btn){
  var done = function(){
    var old = btn.textContent; btn.textContent = 'Copied';
    setTimeout(function(){ btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
  } else { fallback(); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}

// ---------- level cells ----------
function lvlCell(v, p, cls, hit){
  if (v === null || v === undefined || isNaN(v)) return '<td class="lvl ' + cls + '">—</td>';
  return '<td class="lvl ' + cls + (hit ? ' hit' : '') + '"><span class="v">₹' + fmtNum(v, 2) + '</span>' +
    (p !== null && p !== undefined && !isNaN(p) ? '<span class="p">' + (p > 0 ? '+' : '') + p.toFixed(1) + '%</span>' : '') + '</td>';
}
function saidCell(s){
  var t = (s.src_targets && s.src_targets.length) ? s.src_targets.map(function(x){ return '₹' + fmtNum(x, 0); }).join(', ') : '—';
  var sl = (s.src_stop !== null && s.src_stop !== undefined) ? '₹' + fmtNum(s.src_stop, 0) : '—';
  return '<td class="said">T ' + t + '<br>SL ' + sl + '</td>';
}

// ---------- suggestions ----------
function suggestionList(){
  var held = {};
  ((DATA && DATA.positions) || []).forEach(function(p){ held[p.symbol] = true; });
  loadQueue().forEach(function(x){ held[x.symbol] = true; });

// ---------- formalise ----------
function formalise(sym){
  var s = suggestionList().filter(function(p){ return p.symbol === sym; })[0];
  if (!s){ alert(sym + ' is no longer an outstanding suggestion — refresh the page.'); return; }
  var plan = s.plan || {};
  var c = capacity();
  if (c.slots <= 0){
    alert('No room: ' + c.live + ' open/pending/queued against a cap of ' + c.maxOpen + ' positions.\n\nClose a position or drop a queued one first.');
    return;
  }
  // same default as `stocktips book`: deployable cash spread over the free slots
  var alloc = Math.min(c.maxAlloc, Math.max(c.minAlloc, c.cash / Math.max(1, c.slots)), c.cash);
  var qty = Math.floor(alloc / plan.entry);
  if (alloc < c.minAlloc || qty < 1){
    alert('Not enough deployable cash: ' + inr(c.cash) + ' free, minimum allocation is ' + inr(c.minAlloc) + '.');
    return;
  }
  var capital = Math.round(qty * plan.entry * 100) / 100;
  var msg = 'Formalise ' + sym + ' into a tracked paper trade?\n\n' +
    orderLine(sym, qty, plan.entry, plan.stop_loss, plan.targets) + '\n\n' +
    'Allocation ' + inr(capital) + ' (' + qty + ' sh of ' + inr(c.cash) + ' deployable)\n' +
    'Timeframe ' + (plan.timeframe || '?') + ' · R:R ' + (plan.reward_risk_t2 != null ? plan.reward_risk_t2.toFixed(2) : '?') +
    ' · composite ' + s.composite + '\n\nPaper trading only.';
  if (!confirm(msg)) return;
  var q = loadQueue();
  q.push({symbol: sym, company: s.company, entry: plan.entry, stop: plan.stop_loss, targets: plan.targets || [],
          timeframe: plan.timeframe, qty: qty, capital: capital, composite: s.composite,
          ts: new Date().toISOString().slice(0, 16).replace('T', ' ')});
  saveQueue(q);
  renderDesk();
  document.getElementById('activeSection').scrollIntoView({behavior: 'smooth', block: 'start'});
}

document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), sym = el.getAttribute('data-sym');
  if (act === 'book') formalise(sym);
  else if (act === 'drop'){
    if (confirm('Drop ' + sym + ' from the booking queue? It was never written to the ledger.')){
      saveQueue(loadQueue().filter(function(x){ return x.symbol !== sym; }));
      renderDesk();
    }
  } else if (act === 'copy') copyText(el.getAttribute('data-text'), el);
});

  var maxStock = s.capital && s.capital.max_single_stock_pct != null ? s.capital.max_single_stock_pct : 50;
  var maxSl = s.risk && s.risk.max_stop_loss_pct != null ? s.risk.max_stop_loss_pct : 8;
  var minRR = s.risk && s.risk.min_reward_risk_t2 != null ? s.risk.min_reward_risk_t2 : 1.5;
  var wStop = s.mandate && s.mandate.weekly_time_stop_days != null ? s.mandate.weekly_time_stop_days : 10;
  var mStop = s.mandate && s.mandate.monthly_time_stop_days != null ? s.mandate.monthly_time_stop_days : 30;
  document.getElementById('footer').innerHTML =
    'Paper trading &middot; not investment advice &middot; rules: max ' + maxStock + '%/stock, SL &le; ' + maxSl +
    '%, R:R &ge; ' + minRR + ', time stops ' + wStop + '/' + mStop + ' days';
}

function showError(msg){
  document.getElementById('app').innerHTML =
    '<div class="err-box panel"><h2 style="margin-bottom:8px">Could not load dashboard data</h2><p>' + esc(msg) + '</p></div>';
}

fetch('./data.json', {cache:'no-store'})
  .then(function(res){
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function(data){
    document.getElementById('genDate').textContent = 'Generated ' + (data.generated || '—');
    DATA = data;
    reconcileQueue(data.positions || []);
    renderTiles(data.stats || {});
    renderDesk();
    try {
      renderEquityChart(data.equity_curve || [], (data.stats && data.stats.capital) || (data.settings && data.settings.capital && data.settings.capital.total_inr));
    } catch (e) {
      document.getElementById('equityChart').parentElement.innerHTML = '<div class="empty-msg">Chart library unavailable (' + esc(e.message) + ').</div>';
    }
    renderSources(data.sources || []);
    renderClosed(data.closed || []);
    renderAnalysed(data.latest_analysis || []);
    document.getElementById('lessons').innerHTML = mdToHtml(data.lessons_tail || '');
    renderFooter(data.settings || {});
  })
  .catch(function(err){
    showError('data.json not found or invalid — run `python -m stocktips dashboard-data`. (' + err.message + ')');
  });
</script>
</body>
</html>
