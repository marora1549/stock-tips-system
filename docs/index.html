<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1216">
<title>Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ==================================================================== tokens */
:root{
  --bg:#0F1216; --elev:#171B21; --elev-2:#1E242C; --elev-3:#252C36;
  --line:#262E38; --line-2:#323B47;
  --ink:#E9EEF5; --ink-2:#9BA5B4; --ink-3:#8F98A5;
  --blue:#74A6F8; --blue-solid:#2E6FE0; --blue-dim:rgba(75,139,244,.16); --blue-line:rgba(75,139,244,.36);
  --green:#19C57F; --green-dim:rgba(25,197,127,.13); --green-line:rgba(25,197,127,.32);
  --red:#F6767F; --red-dim:rgba(246,118,127,.14); --red-line:rgba(246,118,127,.34);
  --amber:#F0A93B; --amber-dim:rgba(240,169,59,.14);
  --violet:#A98BFA; --violet-dim:rgba(169,139,250,.14);
  --bar:rgba(15,18,22,.9);
  --shadow:0 6px 18px -6px rgba(0,0,0,.55);
  --r:14px; --r-sm:10px; --r-pill:999px;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,0,1);
}
:root[data-theme="light"]{
  --bg:#F4F6F9; --elev:#FFFFFF; --elev-2:#F1F4F8; --elev-3:#E7ECF3;
  --line:#E3E8EF; --line-2:#D3DAE4;
  --ink:#0E1420; --ink-2:#4A5568; --ink-3:#5B6675;
  --blue:#1B5CCC; --blue-solid:#1B5CCC; --blue-dim:rgba(27,92,204,.10); --blue-line:rgba(27,92,204,.28);
  --green:#046B41; --green-dim:rgba(4,107,65,.10); --green-line:rgba(4,107,65,.26);
  --red:#AE222C; --red-dim:rgba(174,34,44,.09); --red-line:rgba(174,34,44,.24);
  --amber:#8A5A08; --amber-dim:rgba(138,90,8,.10);
  --violet:#6134D2; --violet-dim:rgba(97,52,210,.10);
  --bar:rgba(244,246,249,.92);
  --shadow:0 6px 18px -6px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 14px/1.5 var(--sans); font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--blue-dim); color:var(--ink)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px; border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
a{color:var(--blue); text-underline-offset:3px}
button{font-family:inherit}
.ic{width:16px; height:16px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round}
.ic.s{width:13px; height:13px; stroke-width:1.8}
.ic.l{width:20px; height:20px}
.n{font-family:var(--mono); font-feature-settings:"zero" 1; letter-spacing:-.02em}
.up{color:var(--green)} .down{color:var(--red)} .mut{color:var(--ink-3)}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px 96px}

/* ==================================================================== app bar */
.appbar{position:sticky; top:0; z-index:50; background:var(--bar);
  backdrop-filter:blur(14px) saturate(1.4); border-bottom:1px solid var(--line)}
.appbar-in{max-width:1180px; margin:0 auto; padding:11px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-.02em}
.brand .dot{width:9px; height:9px; border-radius:50%; background:var(--ink-3)}
.brand small{font-weight:500; color:var(--ink-3); font-size:11px; letter-spacing:0}
.bar-eq{margin-left:auto; display:flex; align-items:baseline; gap:9px}
.bar-eq .v{font:600 16px/1 var(--mono); letter-spacing:-.03em}
.bar-eq .d{font:600 12px/1 var(--mono)}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  border-radius:var(--r-sm); border:1px solid var(--line); background:var(--elev); color:var(--ink-2);
  cursor:pointer; transition:all .16s var(--ease)}
.iconbtn:hover{color:var(--ink); border-color:var(--line-2); background:var(--elev-2)}
.iconbtn.live{color:var(--green); border-color:var(--green-line); background:var(--green-dim)}

/* ==================================================================== tabs */
.tabs{position:sticky; top:57px; z-index:40; background:var(--bg); border-bottom:1px solid var(--line);
  margin-bottom:20px}
.tabs-in{max-width:1180px; margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto;
  scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{display:inline-flex; align-items:center; gap:7px; padding:13px 14px 12px; border:0; background:none;
  color:var(--ink-3); font:600 13.5px/1 var(--sans); cursor:pointer; white-space:nowrap;
  border-bottom:2px solid transparent; transition:color .16s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--blue)}
.tab .badge{font:600 10.5px/1 var(--mono); padding:3px 6px; border-radius:var(--r-pill);
  background:var(--elev-2); color:var(--ink-3)}
.tab[aria-selected="true"] .badge{background:var(--blue-dim); color:var(--blue)}
.view{display:none}
.view.on{display:block; animation:rise .34s var(--ease)}
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .view.on{animation:none} }

/* ==================================================================== stats */
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:10px; margin-bottom:18px}
.stat{background:var(--elev); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px}
.stat .k{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--ink-3);
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:7px}
.stat .v{font:600 21px/1.1 var(--mono); letter-spacing:-.03em}
.stat .s{margin-top:5px; font-size:11.5px; color:var(--ink-2)}
.stat.wide{grid-column:span 2}

/* ==================================================================== cards */
.card{background:var(--elev); border:1px solid var(--line); border-radius:var(--r);
  margin-bottom:12px; overflow:hidden;
  transition:border-color .16s var(--ease)}
.card:hover{border-color:var(--line-2)}
.card-in{padding:15px 16px}
.chead{display:flex; align-items:flex-start; gap:12px}
.sym{font:700 16px/1.2 var(--sans); letter-spacing:-.02em; display:flex; align-items:center; gap:8px;
  flex-wrap:wrap}
.co{font-size:12px; color:var(--ink-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; max-width:34ch}
.right{margin-left:auto; text-align:right; flex:0 0 auto}
.ltp{font:600 17px/1.15 var(--mono); letter-spacing:-.03em}
.chg{font:600 12px/1.4 var(--mono); margin-top:2px}

/* pills */
.pill{display:inline-flex; align-items:center; gap:5px; font:600 10.5px/1 var(--sans);
  padding:4px 8px; border-radius:var(--r-pill); white-space:nowrap; letter-spacing:.02em}
.pill .ic{width:11px; height:11px; stroke-width:2}
.pill.good{background:var(--green-dim); color:var(--green); box-shadow:inset 0 0 0 1px var(--green-line)}
.pill.bad{background:var(--red-dim); color:var(--red); box-shadow:inset 0 0 0 1px var(--red-line)}
.pill.warn{background:var(--amber-dim); color:var(--amber)}
.pill.flat{background:var(--elev-2); color:var(--ink-2)}
.pill.info{background:var(--blue-dim); color:var(--blue)}
.pill.violet{background:var(--violet-dim); color:var(--violet)}
.pill.strong{background:var(--green); color:#04140C; box-shadow:none}
:root[data-theme="light"] .pill.strong{color:#fff}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.tags .pill{cursor:help}

/* ==================================================================== ladder */
.ladder{margin-top:18px}
.rail{position:relative; height:5px; background:var(--elev-3); border-radius:99px; margin:28px 0 0}
.rail .done{position:absolute; top:0; bottom:0; left:0; background:var(--green); border-radius:99px}
.rail .zone-loss{position:absolute; top:0; bottom:0; left:0; background:var(--red-dim); border-radius:99px}
.mk{position:absolute; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column;
  align-items:center}
.mk .tick{width:2px; height:13px; background:var(--line-2); border-radius:2px}
.mk .lab{position:absolute; bottom:13px; left:50%; transform:translateX(-50%); white-space:nowrap;
  font:600 10px/1.2 var(--mono); color:var(--ink-2); text-align:center}
.mk .sub{position:absolute; top:14px; left:50%; transform:translateX(-50%); white-space:nowrap;
  font:500 10px/1.2 var(--mono); color:var(--ink-2)}
.mk.stop .tick{background:var(--red)} .mk.stop .lab{color:var(--red)}
.mk.entry .tick{background:var(--ink-3)}
.mk.tgt .tick{background:var(--green-line)} .mk.tgt .lab{color:var(--ink-2)}
.mk.tgt.hit .tick{background:var(--green); height:16px} .mk.tgt.hit .lab{color:var(--green)}
.mk.now{z-index:3}
.mk.now .dot{width:13px; height:13px; border-radius:50%; background:var(--blue);
  border:2.5px solid var(--elev); box-shadow:0 0 0 3px var(--blue-dim)}
.mk.now .lab{color:var(--blue); font-weight:700; bottom:15px}
.ladder-legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:34px; font-size:11.5px;
  color:var(--ink-3)}
.ladder-legend span{display:inline-flex; align-items:center; gap:5px}

/* ==================================================================== eta */
.etas{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; align-items:center}
.eta{display:inline-flex; align-items:baseline; gap:6px; padding:6px 10px; border-radius:var(--r-sm);
  background:var(--elev-2); border:1px solid var(--line)}
.eta b{font:700 10px/1 var(--sans); letter-spacing:.06em; color:var(--ink-3)}
.eta .d{font:600 12.5px/1 var(--mono)}
.eta .p{font:500 10.5px/1 var(--mono); color:var(--ink-3)}
.eta .ic{width:11px; height:11px; stroke-width:2.2; color:var(--green)}
.eta.hit{background:var(--green-dim); border-color:var(--green-line)}
.eta.hit b, .eta.hit .d{color:var(--green)}
.eta.soon .d{color:var(--green)}
.eta.late{border-color:var(--amber-dim)} .eta.late .d{color:var(--amber)}
.eta.unknown .d{color:var(--ink-3)}
.pace{display:flex; align-items:flex-start; gap:8px; margin-top:12px; padding:10px 12px;
  border-radius:var(--r-sm); background:var(--elev-2); font-size:12.5px; line-height:1.5; color:var(--ink-2)}
.pace .ic{color:var(--ink-3); margin-top:1px}
.pace.on{background:var(--green-dim); color:var(--green)} .pace.on .ic{color:var(--green)}
.pace.behind{background:var(--amber-dim); color:var(--amber)} .pace.behind .ic{color:var(--amber)}
.pace b{font-family:var(--mono); font-weight:600}

/* ==================================================================== facts + meters */
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:12px 14px; margin-top:15px;
  padding-top:14px; border-top:1px solid var(--line)}
.fact .k{font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:4px; white-space:nowrap}
.fact .v{font:600 13px/1.25 var(--mono); letter-spacing:-.02em}
.fact .v small{font:500 10.5px/1.35 var(--mono); color:var(--ink-3); display:block; margin-top:3px}
.meters{display:flex; gap:14px; margin-top:13px; flex-wrap:wrap}
.meter{flex:1 1 84px; min-width:84px}
.meter .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px}
.meter .lab{font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3)}
.meter .val{font:600 12px/1 var(--mono)}
.meter .bar{height:4px; border-radius:99px; background:var(--elev-3); overflow:hidden}
.meter .bar i{display:block; height:100%; border-radius:99px}
.meter .bar i.b{background:var(--blue)} .meter .bar i.g{background:var(--green)}
.meter .bar i.v{background:var(--violet)} .meter .bar i.a{background:var(--amber)}

/* ==================================================================== buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  font:600 13px/1 var(--sans); padding:10px 15px; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--elev-2); color:var(--ink); cursor:pointer;
  transition:all .16s var(--ease)}
.btn:hover{background:var(--elev-3); border-color:var(--ink-3)}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--blue-solid); border-color:var(--blue-solid); color:#fff}
.btn.pri:hover{filter:brightness(1.1); background:var(--blue-solid)}
.btn.buy{background:var(--green); border-color:var(--green); color:#04150D}
:root[data-theme="light"] .btn.buy{color:#fff}
.btn.buy:hover{filter:brightness(1.06)}
.btn.sell{background:transparent; border-color:var(--red-line); color:var(--red)}
.btn.sell:hover{background:var(--red-dim); border-color:var(--red)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--elev-2); color:var(--ink)}
.btn.sm{padding:7px 11px; font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn[disabled]:hover{filter:none; background:var(--elev-2); border-color:var(--line-2)}
.btn.busy{position:relative; color:transparent !important}
.btn.busy:after{content:''; position:absolute; width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite}
.btn.ghost.busy:after,.btn.sell.busy:after{border-color:var(--line-2); border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:15px}
.actions .grow{flex:1 1 auto}

/* ==================================================================== controls */
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px}
.seg{display:inline-flex; background:var(--elev); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:3px; gap:2px}
.seg button{border:0; background:none; color:var(--ink-3); font:600 12px/1 var(--sans); padding:7px 11px;
  border-radius:7px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
  transition:all .16s var(--ease)}
.seg button:hover{color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--elev-3); color:var(--ink)}
.field{position:relative; display:inline-flex; align-items:center}
.field .ic{position:absolute; left:11px; color:var(--ink-3); pointer-events:none}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{
  font:400 13px/1.4 var(--sans); padding:9px 12px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--elev); color:var(--ink); width:100%}
input.pad{padding-left:32px}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-dim)}
textarea{resize:vertical; min-height:76px; font-family:var(--sans)}
select{appearance:none; cursor:pointer; padding-right:30px}
label.lbl{display:block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:6px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(116px,1fr)); gap:12px}

/* ==================================================================== drawer */
.more{border-top:1px solid var(--line); background:var(--elev-2);
  display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease)}
.card.open .more{grid-template-rows:1fr}
.more>div{min-height:0; overflow:hidden}
.more-in{padding:16px}
.mgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(212px,1fr)); gap:18px 22px}
.mcol{min-width:0}
.mcol h5{margin:0 0 8px; font:600 10.5px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3)}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:3.5px 0;
  border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kv span:last-child{font-family:var(--mono); font-size:11.5px; font-weight:500; white-space:nowrap}
.why{display:flex; gap:8px; font-size:12.5px; padding:2.5px 0; line-height:1.45}
.why .n{font-family:var(--mono); font-size:11px; font-weight:600; min-width:27px; text-align:right; flex:0 0 auto}
.why.p .n{color:var(--green)} .why.m .n{color:var(--red)}
.why span:last-child{min-width:0; overflow-wrap:anywhere; color:var(--ink-2)}
.code{display:flex; align-items:center; gap:9px; margin-top:11px; padding:10px 12px; background:var(--bg);
  border:1px solid var(--line); border-radius:var(--r-sm)}
.code code{flex:1; font:500 11.5px/1.5 var(--mono); overflow-x:auto; white-space:pre; color:var(--ink-2)}

/* ==================================================================== tables */
.tw{overflow-x:auto; background:var(--elev); border:1px solid var(--line); border-radius:var(--r)}
table{width:100%; border-collapse:collapse; font-size:13px}
th{padding:12px 13px; text-align:left; white-space:nowrap; font:600 10px/1 var(--sans);
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--line)}
th.r{text-align:right}
td{padding:12px 13px; border-bottom:1px solid var(--line); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--elev-2)}
td.r{text-align:right}

/* ==================================================================== misc */
.sec{margin-bottom:26px}
.sec-h{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.sec-h h3{margin:0; font:700 15px/1.2 var(--sans); letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.sec-h h3 .ic{color:var(--ink-3)}
.sec-h .note{font-size:12px; color:var(--ink-3); margin-left:auto; text-align:right}
.hint{font-size:12px; line-height:1.65; color:var(--ink-3); margin:10px 0 0}
.hint code{font-family:var(--mono); font-size:11.5px; background:var(--elev-2); padding:1px 5px; border-radius:4px}
.hint b{color:var(--ink-2)}
.empty{background:var(--elev); border:1px dashed var(--line-2); border-radius:var(--r);
  padding:38px 20px; text-align:center; color:var(--ink-3); font-size:13px}
.empty .ic{width:22px; height:22px; display:block; margin:0 auto 12px; color:var(--ink-3)}
.empty b{display:block; color:var(--ink-2); font-size:14px; margin-bottom:5px}
.banner{display:flex; gap:11px; align-items:flex-start; padding:13px 15px; border-radius:var(--r);
  background:var(--blue-dim); border:1px solid var(--blue-line); font-size:12.5px; line-height:1.65;
  color:var(--ink-2); margin-bottom:16px}
.banner .ic{color:var(--blue); margin-top:1px}
.banner.warn{background:var(--amber-dim); border-color:var(--amber-dim)}
.banner.warn .ic{color:var(--amber)}
.banner b{color:var(--ink)}
.chartbox{background:var(--elev); border:1px solid var(--line); border-radius:var(--r); padding:16px;
  height:280px}
.prose{font-size:13.5px; line-height:1.75; color:var(--ink-2); max-width:74ch}
.prose h4{margin:20px 0 6px; font:700 14px/1.3 var(--sans); color:var(--ink)}
.prose h4:first-child{margin-top:0}
.prose table{margin:12px 0; font-size:12.5px}
.prose td,.prose th{white-space:normal}
.prose code{font-family:var(--mono); font-size:12px}
.log{font-size:12.5px}
.log .row{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
.log .row:last-child{border-bottom:0}
.log .when{font:500 11px/1.5 var(--mono); color:var(--ink-3); flex:0 0 84px}
.log .what{flex:1; min-width:0}
.log .what b{font-family:var(--mono); font-size:12px}
.log pre{margin:6px 0 0; padding:9px 11px; background:var(--bg); border:1px solid var(--line);
  border-radius:8px; font:500 11px/1.55 var(--mono); color:var(--ink-3); overflow-x:auto;

<script>
/* ==================================================================== helpers */
function $(s, r){ return (r || document).querySelector(s); }
function el(tag, cls){ var n = document.createElement(tag); if (cls) n.className = cls; return n; }
function esc(s){ if (s == null) return ''; return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ic(id, cls){ return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + id + '"/></svg>'; }
function inr(n, dec){
  if (n == null || isNaN(n)) return '—';
  var neg = n < 0; n = Math.abs(Number(n));
  var f = n.toFixed(dec == null ? 0 : dec).split('.'), i = f[0], d = f[1];
  var l3 = i.slice(-3), rest = i.slice(0, -3);
  if (rest !== '') l3 = ',' + l3;
  return (neg ? '−₹' : '₹') + rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + l3 + (d ? '.' + d : '');
}
function short(n){
  if (n == null || isNaN(n)) return '—';
  var a = Math.abs(n), s = n < 0 ? '−₹' : '₹';
  if (a >= 1e7) return s + (a / 1e7).toFixed(2) + 'cr';
  if (a >= 1e5) return s + (a / 1e5).toFixed(2) + 'L';
  if (a >= 1000) return s + (a / 1000).toFixed(1) + 'k';
  return inr(n);
}
function rs(n){ return inr(n, 2); }
function num(n, d){ return (n == null || isNaN(n)) ? '—' : Number(n).toFixed(d == null ? 2 : d); }
function pct(n, d){
  if (n == null || isNaN(n)) return '—';
  d = d == null ? 2 : d;
  return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(d) + '%';
}
function sgn(n){ return (n == null || isNaN(n) || n === 0) ? 'mut' : n > 0 ? 'up' : 'down'; }
function ago(iso){
  if (!iso) return '';
  var t = new Date(iso);
  if (isNaN(t)) return String(iso);
  var m = Math.round((Date.now() - t.getTime()) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
}
function toast(msg, kind){
  var t = $('#toast');
  t.className = 'toast show ' + (kind || '');
  t.innerHTML = ic(kind === 'err' ? 'alert' : 'check') + '<span>' + esc(msg) + '</span>';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'toast ' + (kind || ''); }, 4600);
}
function copy(text){
  var done = function(){ toast('Copied to clipboard', 'ok'); };
  var fb = function(){
    var ta = el('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb);
  else fb();
}

/* ==================================================================== state */
var DATA = null, TAB = 'book', RUNS = [], POLLS = 0;
var IKEY = 'stocktips.intents.v2', GKEY = 'stocktips.gh.v1', TKEY = 'stocktips.theme.v1';
var SORT = 'eta', FILTER = {tf:'all', q:'', afford:false, tag:''};
var GH = {token:'', repo:'', ok:false};
var REPO = (function(){
  var m = location.hostname.match(/^([^.]+)\.github\.io$/);
  var seg = location.pathname.split('/').filter(Boolean);
  if (m) return {owner:m[1], repo:seg[0] || (m[1] + '.github.io')};
  return {owner:'marora1549', repo:'stock-tips-system'};
})();

function store(k, v){ try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function intents(){ var v = recall(IKEY, []); return Array.isArray(v) ? v : []; }
function setIntents(v){ store(IKEY, v); }

/* An intent clears itself the moment the ledger reflects it, so the queue can never drift. */
function reconcile(){
  var held = {};
  ((DATA && DATA.positions) || []).forEach(function(p){ held[p.symbol] = true; });
  var capital = (DATA && DATA.book && DATA.book.capital_inr) || 0;
  var before = intents();
  var kept = before.filter(function(x){
    if (x.kind === 'book') return !held[x.symbol];
    if (x.kind === 'close') return !!held[x.symbol];
    if (x.kind === 'capital') return x.capitalWas === capital;
    return false;
  });
  if (kept.length !== before.length) setIntents(kept);
  return kept;
}
function intentsOf(kind, sym){
  return intents().filter(function(x){ return x.kind === kind && (!sym || x.symbol === sym); });
}
function capacity(){
  var b = (DATA && DATA.book) || {}, q = intents();
  var out = q.filter(function(x){ return x.kind === 'book'; });
  var freeing = q.filter(function(x){ return x.kind === 'close'; }).reduce(function(s, x){ return s + (x.returns || 0); }, 0);
  var added = q.filter(function(x){ return x.kind === 'capital'; }).reduce(function(s, x){ return s + (x.amount || 0); }, 0);
  var maxPct = b.max_single_stock_pct || 50, minPct = b.min_allocation_pct || 15;
  var capital = (b.capital_inr || 0) + added;
  return {
    slots: Math.max(0, (b.slots_left || 0) - out.length + intentsOf('close').length),
    cash: Math.max(0, (b.deployable_cash || 0) + freeing + added -
                      out.reduce(function(s, x){ return s + (x.capital || 0); }, 0)),
    maxOpen: b.max_open_positions || 0, base: b.capital_inr || 0, capital: capital, queuedCapital: added,
    minAlloc: Math.round(capital * minPct / 100), maxAlloc: Math.round(capital * maxPct / 100),
    maxPct: maxPct, minPct: minPct
  };
}
function sizeFor(entry){
  var c = capacity();
  var alloc = Math.min(c.maxAlloc, Math.max(c.minAlloc, c.cash / Math.max(1, c.slots)), c.cash);
  var qty = Math.floor(alloc / entry);
  return {qty:qty, capital:Math.round(qty * entry * 100) / 100,
          ok:c.slots > 0 && alloc >= c.minAlloc && qty >= 1, cap:c};
}
function orderLine(sym, qty, entry, stop, targets){
  return 'BUY ' + qty + ' ' + sym + ' NSE CNC limit ₹' + num(entry) + ' · SL-M ₹' + num(stop) +
         ' · GTT ₹' + (targets || []).map(function(t){ return num(t); }).join(' / ');
}

/* ==================================================================== github bridge */
var API = 'https://api.github.com';
function heads(token){
  return {Authorization:'Bearer ' + (token || GH.token), Accept:'application/vnd.github+json',
          'X-GitHub-Api-Version':'2022-11-28'};
}
function ghCheck(token){
  return fetch(API + '/repos/' + REPO.owner + '/' + REPO.repo, {headers:heads(token)})
    .then(function(r){
      if (!r.ok) throw new Error(r.status === 401 ? 'token rejected by GitHub'
        : r.status === 404 ? 'this token cannot see ' + REPO.owner + '/' + REPO.repo : 'GitHub returned ' + r.status);
      return r.json();
    })
    .then(function(repo){
      if (!repo.permissions || !repo.permissions.push) throw new Error('token is read-only — it needs Contents: write');
      GH = {token:token, repo:repo.full_name, ok:true};
      store(GKEY, {token:token});
      return repo;
    })
    .catch(function(e){ GH.ok = false; throw e; });
}
function ghDispatch(command, inputs){
  var body = {ref:'main', inputs:Object.assign({command:command}, inputs || {})};
  Object.keys(body.inputs).forEach(function(k){
    if (body.inputs[k] == null || String(body.inputs[k]).trim() === '') delete body.inputs[k];
    else body.inputs[k] = String(body.inputs[k]);
  });
  return fetch(API + '/repos/' + REPO.owner + '/' + REPO.repo + '/actions/workflows/desk.yml/dispatches',
               {method:'POST', headers:heads(), body:JSON.stringify(body)})
    .then(function(r){
      if (r.status === 204) return true;
      return r.text().then(function(t){
        var msg = t;
        try { msg = JSON.parse(t).message || t; } catch (e) {}
        throw new Error(msg || ('HTTP ' + r.status));
      });
    });
}
function pollRuns(kick){
  if (!GH.ok) return;
  if (kick) POLLS = 0;
  fetch(API + '/repos/' + REPO.owner + '/' + REPO.repo + '/actions/workflows/desk.yml/runs?per_page=8',
        {headers:heads()})
    .then(function(r){ return r.ok ? r.json() : {workflow_runs:[]}; })
    .then(function(j){
      RUNS = j.workflow_runs || [];
      if (TAB === 'console') renderConsole();
      var busy = RUNS.some(function(r){ return r.status === 'queued' || r.status === 'in_progress'; });
      if ((busy || kick) && POLLS < 45){ POLLS++; setTimeout(pollRuns, busy ? 6000 : 9000); }
    })
    .catch(function(){});
}

/* Run a command for real when connected; otherwise queue it and hand over the CLI line. */
function run(command, inputs, opts){
  opts = opts || {};
  var label = opts.label || command;
  if (!GH.ok){
    if (opts.queue){ opts.queue(); toast('Queued — connect GitHub in Console to run it from here'); render(); }
    else toast('Connect GitHub in the Console tab to run this from here', 'err');
    return Promise.resolve();
  }
  if (opts.btn) opts.btn.classList.add('busy');
  return ghDispatch(command, inputs)
    .then(function(){
      toast(label + ' sent to GitHub — the ledger updates in about a minute', 'ok');
      if (opts.queue) opts.queue();
      pollRuns(true);
      render();
    })
    .catch(function(e){ toast('Could not run ' + label + ': ' + e.message, 'err'); })
    .then(function(){ if (opts.btn) opts.btn.classList.remove('busy'); });
}

/* ==================================================================== pieces */
var TAG_ICON = {fundamentals:'scale', technicals:'chart', momentum:'bolt', 'tight-stop':'shield',
  asymmetric:'target', corroborated:'rss', 'slow-clock':'clock', sluggish:'clock',
  'weak-books':'alert', 'hot-potato':'alert', trend:'gauge'};
function tagPills(tags){
  if (!tags || !tags.length) return '';
  return tags.map(function(t){
    var i = TAG_ICON[t.key];
    return '<span class="pill ' + (t.tone || 'flat') + '" title="' + esc(t.why || '') + '">' +
      (i ? ic(i) : '') + esc(t.label) + '</span>';
  }).join('');
}

/* The ladder: stop, entry, three targets and where the price actually is — on one line.
   Labels are laid out in two lanes and coincident marks are merged, because a stop trailed to
   breakeven sits exactly on the entry and two labels in one place read as neither. */
function ladder(o){
  var ts = (o.targets || []).filter(function(x){ return x != null; });
  var entry = o.entry, stop = o.stop, now = o.now, hits = o.hits || [];
  if (!entry || !ts.length) return '';
  var lo = Math.min(stop || entry, entry, now || entry);
  var hi = Math.max.apply(null, ts.concat([now || entry, entry]));
  var span = (hi - lo) || 1, pad = span * 0.07;
  lo -= pad; hi += pad; span = hi - lo;
  var at = function(v){ return Math.max(0, Math.min(100, (v - lo) / span * 100)); };

  var marks = [];
  if (stop){
    var breakeven = Math.abs(stop - entry) / entry < 0.0015;
    marks.push({cls:'stop', v:stop, lab:inr(stop, 2),
                sub:breakeven ? 'stop = entry' : (o.stopPct != null ? pct(-Math.abs(o.stopPct), 1) : ''),
                merged:breakeven});
  }
  if (!marks.length || !marks[0].merged){
    marks.push({cls:'entry', v:entry, lab:inr(entry, 2), sub:o.entryLabel || 'entry'});
  }
  ts.forEach(function(t, i){
    var hit = hits.indexOf(i + 1) !== -1;
    var bits = [];
    if (!hit && o.targetPct && o.targetPct[i] != null) bits.push(pct(o.targetPct[i], 1));
    if (!hit && o.eta && o.eta[i]) bits.push('~' + o.eta[i] + 'd');
    marks.push({cls:'tgt' + (hit ? ' hit' : ''), v:t, lab:'T' + (i + 1) + ' ' + inr(t, 2),
                sub:hit ? 'taken' : bits.join(' · ')});
  });
  if (now) marks.push({cls:'now', v:now, lab:inr(now, 2), sub:''});

  marks.forEach(function(m){ m.at = at(m.v); });
  marks.sort(function(a, b){ return a.at - b.at; });
  // anything within 9% of the rail of its neighbour drops to the second label lane
  var lastByLane = [-99, -99];
  marks.forEach(function(m){
    var lane = (m.at - lastByLane[0] > 9) ? 0 : (m.at - lastByLane[1] > 9 ? 1 : 0);
    m.lane = lane;
    lastByLane[lane] = m.at;
  });

  var html = [];
  if (stop) html.push('<div class="zone-loss" style="width:' + at(stop).toFixed(2) + '%"></div>');
  html.push('<div class="done" style="width:' +
    at(now && now > entry ? Math.min(now, hi) : entry).toFixed(2) + '%"></div>');
  marks.forEach(function(m){
    var up = m.lane ? ' style="bottom:26px"' : '';
    var down = m.lane ? ' style="top:27px"' : '';
    html.push('<div class="mk ' + m.cls + '" style="left:' + m.at.toFixed(2) + '%">' +
      '<span class="lab"' + up + '>' + esc(m.lab) + '</span>' +
      (m.cls === 'now' ? '<span class="dot"></span>' : '<span class="tick"></span>') +
      (m.sub ? '<span class="sub"' + down + '>' + esc(m.sub) + '</span>' : '') + '</div>');
  });
  var tall = marks.some(function(m){ return m.lane === 1; });
  return '<div class="ladder"><div class="rail"' + (tall ? ' style="margin-top:42px"' : '') + '>' +
    html.join('') + '</div><div class="ladder-legend"' + (tall ? ' style="margin-top:48px"' : '') + '>' +
    (o.legend || '') + '</div></div>';
}

function etaChips(plan, hits){
  var eta = plan.eta_days || [], tp = plan.target_pct || [], clock = plan.time_stop_days;
  hits = hits || [];
  var none = !eta.length || eta.every(function(d){ return d == null; });
  if (none){
    return '<div class="etas"><span class="eta unknown">' + ic('clock') + '<b>PACE</b>' +
      '<span class="d">not yet dated</span></span>' +

function whyList(list){

/* ==================================================================== ideas */
function ideaList(){
  var held = {};
  ((DATA && DATA.positions) || []).forEach(function(p){ held[p.symbol] = true; });
  intentsOf('book').forEach(function(x){ held[x.symbol] = true; });
  var q = FILTER.q.trim().toUpperCase();
  var list = ((DATA && DATA.latest_analysis) || []).filter(function(p){
    if (!(p.verdict === 'BUY' || p.verdict === 'STRONG BUY')) return false;
    if (held[p.symbol] || !p.plan || !p.plan.entry) return false;
    if (FILTER.tf !== 'all' && (p.plan.timeframe || '') !== FILTER.tf) return false;
    if (FILTER.afford && !sizeFor(p.plan.entry).ok) return false;
    if (FILTER.tag && !(p.tags || []).some(function(t){ return t.key === FILTER.tag; })) return false;
    if (q && (p.symbol + ' ' + (p.company || '') + ' ' + (p.source_id || '')).toUpperCase().indexOf(q) === -1) return false;
    return true;
  });
  var key = {
    eta: function(p){ var d = (p.plan.eta_days || [])[0]; return d == null ? 1e6 : d; },
    composite: function(p){ return -(p.composite || 0); },
    momentum: function(p){ return -((p.ta && p.ta.momentum_score) || 0); },
    rr: function(p){ return -(p.plan.reward_risk_t2 || 0); },
    fund: function(p){ return -(p.fund_score || 0); },
    upside: function(p){ return -((p.plan.target_pct || [])[2] || 0); }
  }[SORT] || function(p){ return -(p.composite || 0); };
  return list.sort(function(a, b){
    var d = key(a) - key(b);
    return d !== 0 ? d : (b.composite || 0) - (a.composite || 0);
  });
}

/* Best-effort read of a pasted tip. It fills a form the analyst then checks — it never decides. */
function parseTip(text){
  var raw = String(text || '');
  // 11,750 is one number and ₹ is not a digit; do that before anything else looks for numbers
  var t = ' ' + raw.replace(/(\d),(?=\d\d\d\b)/g, '$1').replace(/[₹]/g, ' ').replace(/\s+/g, ' ') + ' ';
  var out = {};
  var first = function(re){
    var m = t.match(re);
    if (!m) return null;
    var n = (m[1].match(/\d+(?:\.\d+)?/) || [])[0];
    return n == null ? null : Number(n);
  };
  // a target keyword, then the run of numbers and separators that follows it — stopping at the
  // first token that is neither, so "977 / 1013 / 1080 and beyond" yields three prices, not none
  var tm = t.match(/(?:targets?|tgt|tp|target price)\s*(?:of|at|:|-|is|are)?\s*((?:\d[\d.]*\s*(?:\/|,|-|–|&|and|then|\+)?\s*){1,3})/i);
  if (tm){
    var tg = (tm[1].match(/\d+(?:\.\d+)?/g) || []).map(Number).slice(0, 3);
    if (tg.length) out.target = tg.join(', ');
  }
  var sl = first(/(?:sl|stop\s*loss|stoploss|stop)\s*(?:of|at|:|-|is)?\s*([\d.]+)/i);
  if (sl != null) out.stop = sl;
  var en = first(/(?:cmp|entry|accumulate)\b[^\d]{0,20}?([\d.]+)/i);   // "accumulate INFY at 1560"
  if (en == null) en = first(/\b(?:above|around|near|abv)\s*(?:rs\.?)?\s*([\d.]+)/i);
  if (en == null) en = first(/\bbuy\b[^\d]{0,24}?([\d.]+)/i);
  if (en != null) out.entry = en;

  var skip = {BUY:1, SELL:1, HOLD:1, SL:1, TGT:1, TP:1, CMP:1, TARGET:1, TARGETS:1, NSE:1, BSE:1,
              STOP:1, STOPLOSS:1, LOSS:1, INR:1, RS:1, GTT:1, CNC:1, MIS:1, VIEW:1, PRICE:1,
              ACCUMULATE:1, ABOVE:1, AROUND:1, NEAR:1, AND:1, THEN:1, BOOK:1, PROFIT:1};
  var words = raw.match(/\b[A-Z][A-Z0-9&-]{1,14}\b/g) || [];
  for (var i = 0; i < words.length; i++){
    if (!skip[words[i]] && !/^\d+$/.test(words[i])){ out.symbol = words[i]; break; }
  }
  if (/\b(intraday|today only|scalp|btst)\b/i.test(t)) out.timeframe = 'intraday';
  else if (/\b(month|monthly|swing|4-6 week|6 week|quarter)\b/i.test(t)) out.timeframe = 'monthly';
  else if (/\b(long term|longterm|1 year|one year|investment|multi.?year)\b/i.test(t)) out.timeframe = 'long';
  return out;
}
function fillTipForm(){
  var p = parseTip($('#tipText') ? $('#tipText').value : '');
  var set = function(id, v){ var n = $(id); if (n && v != null && v !== '') n.value = v; };
  set('#tipSym', p.symbol); set('#tipTgt', p.target); set('#tipStop', p.stop); set('#tipEntry', p.entry);
  if (p.timeframe && $('#tipTf')) $('#tipTf').value = p.timeframe;

              : 'Could not read anything from that — fill it in by hand', found ? 'ok' : 'err');
}

function mdToHtml(md){
  if (!md || !md.trim()) return '<p>Nothing recorded yet.</p>';
  var lines = md.replace(/\r\n/g, '\n').split('\n'), out = [], i = 0;
  function inline(t){
    return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>')
                 .replace(/`(.+?)`/g, '<code>$1</code>');
  }
  while (i < lines.length){
    var line = lines[i];
    if (!line.trim()){ i++; continue; }
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){ out.push('<h4>' + inline(h[2]) + '</h4>'); i++; continue; }
    if (/^\|.*\|\s*$/.test(line)){
      var rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
      if (rows.length && /^\|?[\s:|-]+\|?$/.test(rows[1] || '')) rows.splice(1, 1);
      out.push('<div class="tw"><table><tbody>' + rows.map(function(r, ri){
        var cells = r.replace(/^\||\|$/g, '').split('|').map(function(c){ return c.trim(); });
        var tag = ri === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function(c){ return '<' + tag + '>' + inline(c) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>');
      continue;
    }
    if (/^[-*]\s+/.test(line)){
      var items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i])){
        items.push('<li>' + inline(lines[i].replace(/^[-*]\s+/, '')) + '</li>'); i++;
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    var para = [line]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s/.test(lines[i]) &&
           !/^\|.*\|\s*$/.test(lines[i]) && !/^[-*]\s+/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push('<p>' + inline(para.join(' ')) + '</p>');
  }
  return out.join('\n');
}

/* ==================================================================== actions */
function takeIdea(sym, btn){
  var s = ideaList().filter(function(p){ return p.symbol === sym; })[0];
  if (!s){ toast(sym + ' is no longer on the list — reload', 'err'); return; }
  var pl = s.plan || {}, size = sizeFor(pl.entry), c = size.cap;
  if (c.slots <= 0){ toast('No slots free — exit a position or add capital', 'err'); return; }
  if (!size.ok){
    toast('Only ' + inr(c.cash) + ' deployable against a ' + inr(c.minAlloc) + ' minimum position', 'err');
    return;
  }
  var eta = (pl.eta_days || [])[0];
  if (!window.confirm('Take ' + sym + '?\n\n' + orderLine(sym, size.qty, pl.entry, pl.stop_loss, pl.targets) +
      '\n\n' + inr(size.capital) + ' of ' + inr(c.cash) + ' deployable' +
      (eta ? '\nT1 about ' + eta + ' sessions out at its current pace' : '') +
      '\nReward:risk ' + num(pl.reward_risk_t2) + ' to T2 · conviction ' + s.composite +
      '\n\nPaper trading only.')) return;
  run('book', {symbol:sym, amount:Math.round(size.capital)}, {
    label:'Take ' + sym, btn:btn,
    queue:function(){
      var list = intents();
      list.push({kind:'book', symbol:sym, company:s.company, source:s.source_id, entry:pl.entry,
                 stop:pl.stop_loss, targets:pl.targets || [], eta:pl.eta_days, timeframe:pl.timeframe,
                 qty:size.qty, capital:size.capital, composite:s.composite,
                 ts:new Date().toISOString().slice(0, 16).replace('T', ' ')});
      setIntents(list);
    }
  });
}

function exitPosition(sym, btn){
  var p = positions().filter(function(x){ return x.symbol === sym; })[0];
  if (!p) return;
  var pending = p.status === 'pending', qty = p.qty_open != null ? p.qty_open : p.qty;
  var back = pending ? p.capital_inr
    : Math.round((p.ltp != null ? p.ltp : (p.entry || p.entry_plan)) * qty * 100) / 100;
  var msg = pending
    ? 'Cancel ' + sym + ' before it fills?\n\n' + inr(p.capital_inr) + ' returns to cash and the slot frees ' +
      'up. Nothing was bought, so no outcome is recorded against the source.'
    : 'Exit ' + sym + ' now?\n\n' + qty + ' shares at the last close (' + rs(p.ltp) + ') ≈ ' + inr(back) +
      ' back to cash, P&L ' + pct(p.unrealised_pct) + '.\n\nRecorded as a manual exit: the return counts ' +
      'towards the source’s expectancy but not its score, because this is your call, not the tip’s.';
  if (!window.confirm(msg)) return;
  var note = window.prompt('Why? (kept in the position notes)', 'freeing capital for a stronger idea');
  if (note === null) return;
  run('close', {symbol:sym, note:note}, {
    label:(pending ? 'Cancel ' : 'Exit ') + sym, btn:btn,
    queue:function(){
      var list = intents();
      list.push({kind:'close', symbol:sym, status:p.status, returns:back, note:note,
                 ts:new Date().toISOString().slice(0, 16).replace('T', ' ')});
      setIntents(list);
    }
  });
}

function moveCapital(raw, note, btn, out){
  var c = capacity();
  var amount = Math.round(Number(String(raw == null ? '' : raw).replace(/[^0-9.]/g, '')));
  if (!amount || isNaN(amount) || amount <= 0){ toast('Enter a rupee amount', 'err'); return; }
  if (out && amount > c.cash){ toast('Only ' + inr(c.cash) + ' is uncommitted', 'err'); return; }
  var after = c.base + (out ? -amount : amount);
  if (!window.confirm((out ? 'Withdraw ' : 'Deposit ') + inr(amount) + '?\n\nBase ' + inr(c.base) + ' → ' +
      inr(after) + '\nPer-stock ceiling becomes ' + inr(Math.round(after * c.maxPct / 100)) +
      '\nMinimum position becomes ' + inr(Math.round(after * c.minPct / 100)))) return;
  run('capital', out ? {withdraw:amount, note:note} : {amount:amount, note:note}, {
    label:(out ? 'Withdraw ' : 'Deposit ') + inr(amount), btn:btn,
    queue:function(){
      if (out) return;
      var list = intents();
      list.push({kind:'capital', amount:amount, capitalWas:c.base, note:note,
                 ts:new Date().toISOString().slice(0, 16).replace('T', ' ')});
      setIntents(list);
    }
  });
}

document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var act = t.getAttribute('data-act'), sym = t.getAttribute('data-sym');
  var val = function(id){ var n = $(id); return n ? String(n.value || '').trim() : ''; };
  if (act === 'book') takeIdea(sym, t);
  else if (act === 'close') exitPosition(sym, t);
  else if (act === 'copy') copy(t.getAttribute('data-text'));
  else if (act === 'more'){
    var card = document.querySelector('[data-card="' + t.getAttribute('data-card') + '"]');
    if (card) card.classList.toggle('open');
  }
  else if (act === 'sort'){ SORT = t.getAttribute('data-sort'); renderIdeas(); }
  else if (act === 'tf'){ FILTER.tf = t.getAttribute('data-tf'); renderIdeas(); }
  else if (act === 'tag'){ FILTER.tag = t.getAttribute('data-tag'); renderIdeas(); }
  else if (act === 'afford'){ FILTER.afford = !FILTER.afford; renderIdeas(); }
  else if (act === 'drop'){
    var kind = t.getAttribute('data-kind');
    if (window.confirm('Drop this from the queue? It was never written to the ledger.')){
      setIntents(intents().filter(function(x){
        return !(x.kind === kind && (kind === 'capital' || x.symbol === sym)); }));
      render();
    }
  }
  else if (act === 'connect'){
    var tok = val('#ghToken');
    if (!tok){ toast('Paste a token first', 'err'); return; }
    t.classList.add('busy');
    ghCheck(tok)
      .then(function(){ toast('Connected — the buttons are live', 'ok'); pollRuns(true); render(); })
      .catch(function(err){ toast(err.message, 'err'); })
      .then(function(){ t.classList.remove('busy'); });
  }
  else if (act === 'disconnect'){
    GH = {token:'', repo:'', ok:false}; store(GKEY, undefined); RUNS = [];
    toast('Token removed from this browser'); render();
  }
  else if (act === 'cmd'){
    var cmd = t.getAttribute('data-cmd');
    if (!window.confirm('Run ' + cmd + ' now?\n\nIt runs in GitHub Actions against the live ledger and ' +
        'commits whatever it changes.')) return;
    run(cmd, {}, {label:cmd, btn:t});
  }
  else if (act === 'parse-tip') fillTipForm();
  else if (act === 'add-tip'){
    if (!val('#tipSym')){ toast('Which symbol? Paste the message and press Re-read, or type it', 'err'); return; }
    run('add-tip', {symbol:val('#tipSym'), source:val('#tipSrc') || 'manual:mohan', target:val('#tipTgt'),
                    stop:val('#tipStop'), entry:val('#tipEntry'), timeframe:val('#tipTf'), text:val('#tipText')},
        {label:'Log ' + val('#tipSym'), btn:t});
  }
  else if (act === 'cap-add') moveCapital(val('#capAmt'), val('#capNote'), t, false);
  else if (act === 'cap-out') moveCapital(val('#capAmt'), val('#capNote'), t, true);
  else if (act === 'lesson'){
    var text = val('#lessonText');
    if (text.length < 12){ toast('Write a sentence worth keeping', 'err'); return; }
    run('lesson', {text:text}, {label:'Lesson', btn:t});
  }
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'ideaSearch'){
    FILTER.q = e.target.value;
    clearTimeout(window._sq);
    window._sq = setTimeout(function(){
      renderIdeas();
      var s = $('#ideaSearch'); if (s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 160);
  }
});

/* ==================================================================== shell */
var TABS = [
  {id:'book', label:'The book', icon:'book', count:function(){ return positions().length; }},
  {id:'ideas', label:'Ideas', icon:'bulb', count:function(){ return ideaList().length; }},
  {id:'journal', label:'Journal', icon:'chart', count:function(){ return (DATA.closed || []).length || null; }},
  {id:'sources', label:'Sources', icon:'rss', count:function(){ return (DATA.sources || []).length; }},
  {id:'console', label:'Console', icon:'term', count:function(){ return null; }}
];
function renderTabs(){
  $('#tabbar').innerHTML = TABS.map(function(t){
    var n = t.count();
    return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (TAB === t.id) + '">' +
      ic(t.icon) + t.label + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
  }).join('');
}
function show(tab){
  TAB = tab;
  if (location.hash !== '#' + tab) location.hash = '#' + tab;
  TABS.forEach(function(t){ $('#v-' + t.id).classList.toggle('on', t.id === tab); });
  renderTabs();
  if (tab === 'journal') renderJournal();
  if (tab === 'sources') renderSources();
  if (tab === 'console') renderConsole();
}
document.addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-tab]') : null;
  if (t) show(t.getAttribute('data-tab'));
});
document.addEventListener('keydown', function(e){
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var i = ['1','2','3','4','5'].indexOf(e.key);
  if (i !== -1){ show(TABS[i].id); return; }
  if (e.key === '/'){
    show('ideas');
    setTimeout(function(){ var s = $('#ideaSearch'); if (s) s.focus(); }, 60);
    e.preventDefault();
  }
});

function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  store(TKEY, mode);
  var b = $('#themeBtn');
  b.innerHTML = '<svg class="ic"><use href="#i-' + (mode === 'dark' ? 'sun' : 'moon') + '"/></svg>';
  b.title = mode === 'dark' ? 'Switch to light' : 'Switch to dark';
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', mode === 'dark' ? '#0F1216' : '#F4F6F9');
  if (DATA && TAB === 'journal') renderJournal();
}
$('#themeBtn').addEventListener('click', function(){
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
$('#connBtn').addEventListener('click', function(){ show('console'); });
window.addEventListener('hashchange', function(){
  var h = (location.hash || '').replace('#', '');
  if (h && h !== TAB && TABS.some(function(t){ return t.id === h; })) show(h);
});

function render(){
  reconcile();
  var s = DATA.stats || {};
  $('#barEq').textContent = inr(s.equity);
  $('#barRet').innerHTML = '<span class="' + sgn(s.return_pct) + '">' + pct(s.return_pct) + '</span>';
  $('#brandSub').textContent = DATA.analysis_day ? '· ' + DATA.analysis_day : '';
  $('#liveDot').style.background = GH.ok ? 'var(--green)' : 'var(--ink-3)';
  $('#liveDot').style.boxShadow = GH.ok ? '0 0 0 3px var(--green-dim)' : 'none';
  $('#connBtn').classList.toggle('live', GH.ok);
  $('#connBtn').title = GH.ok ? 'Connected to GitHub' : 'Not connected';
  renderBook();
  renderIdeas();
  renderTabs();
  if (TAB === 'journal') renderJournal();
  if (TAB === 'sources') renderSources();
  if (TAB === 'console') renderConsole();
  var st = DATA.settings || {}, r = st.risk || {}, m = st.mandate || {};
  $('#foot').innerHTML =
    '<span>Stops never wider than ' + (r.max_stop_loss_pct || 8) + '% · reward:risk to T2 at least ' +
    (r.min_reward_risk_t2 || 1.5) + ' · time stops ' + (m.weekly_time_stop_days || 10) + ' and ' +
    (m.monthly_time_stop_days || 30) + ' sessions · at most ' + ((st.capital || {}).max_open_positions || 4) +
    ' open</span><span>Paper trading, not investment advice · data generated ' + esc(DATA.generated || '—') + '</span>';
}

applyTheme(recall(TKEY, (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'));
var savedToken = recall(GKEY, null);

fetch('./data.json', {cache:'no-store'})
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(data){
    DATA = data;
    var h = (location.hash || '').replace('#', '');
    TAB = TABS.some(function(t){ return t.id === h; }) ? h : 'book';
    render();
    show(TAB);
    if (savedToken && savedToken.token){
      ghCheck(savedToken.token)
        .then(function(){ render(); pollRuns(true); })
        .catch(function(){ store(GKEY, undefined); render(); });
    }
  })
  .catch(function(err){
    $('#shell').innerHTML = '<div class="empty" style="margin-top:60px">' + ic('alert', 'l') +
      '<b>No data to read</b><code>docs/data.json</code> is missing or malformed. Run ' +
      '<code>python -m stocktips dashboard-data</code> and push. (' + esc(err.message) + ')</div>';
  });
</script>
