name: desk

# The dashboard's hands. docs/index.html asks GitHub to run this workflow, this workflow runs the
# same `stocktips` command the analyst would have typed, and the commit it pushes is what the
# dashboard reads back. Inputs never touch a shell — scripts/desk_command.py turns them into argv.
on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        required: true
        type: choice
        options:
          - book
          - close
          - capital
          - add-tip
          - lesson
          - add-source
          - gather
          - structure
          - analyze
          - pick
          - pick-book
          - eod
          - morning
          - status
          - dashboard-data
      symbol:
        description: NSE symbol, or a company name for add-tip
        required: false
      amount:
        description: Rupees — allocation for book, deposit for capital
        required: false
      withdraw:
        description: Rupees to withdraw (capital only)
        required: false
      price:
        description: Exit price (close only)
        required: false
      target:
        description: Target price, or a comma-separated list (add-tip)
        required: false
      stop:
        description: Stop-loss price (add-tip)
        required: false
      entry:
        description: Entry price the source quoted (add-tip)
        required: false
      timeframe:
        description: weekly / monthly / long / intraday
        required: false
      action:
        description: buy / sell / hold (add-tip)
        required: false
      source:
        description: Source id, e.g. manual:mohan
        required: false
      company:
        description: Company name (add-tip)
        required: false
      url:
        description: Link to the tip (add-tip)
        required: false
      kind:
        description: Source kind (add-source)
        required: false
      channel:
        description: Telegram channel (add-source)
        required: false
      query:
        description: Search query (add-source)
        required: false
      text:
        description: The lesson, or the original message for add-tip
        required: false
      note:
        description: Free-text note recorded with the action
        required: false

permissions:
  contents: write

concurrency:
  group: desk-state          # the ledger has one writer at a time, whoever asked first
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run the command
        id: run
        env:
          PYTHONPATH: src
          DESK_COMMAND: ${{ inputs.command }}
          DESK_SYMBOL: ${{ inputs.symbol }}
          DESK_AMOUNT: ${{ inputs.amount }}
          DESK_WITHDRAW: ${{ inputs.withdraw }}
          DESK_PRICE: ${{ inputs.price }}
          DESK_TARGET: ${{ inputs.target }}
          DESK_STOP: ${{ inputs.stop }}
          DESK_ENTRY: ${{ inputs.entry }}
          DESK_TIMEFRAME: ${{ inputs.timeframe }}
          DESK_ACTION: ${{ inputs.action }}
          DESK_SOURCE: ${{ inputs.source }}
          DESK_COMPANY: ${{ inputs.company }}
          DESK_URL: ${{ inputs.url }}
          DESK_KIND: ${{ inputs.kind }}
          DESK_CHANNEL: ${{ inputs.channel }}
          DESK_QUERY: ${{ inputs.query }}
          DESK_TEXT: ${{ inputs.text }}
          DESK_NOTE: ${{ inputs.note }}
        run: python scripts/desk_command.py | tee /tmp/desk-output.txt

      - name: Refresh the dashboard payload
        if: always() && steps.run.outcome == 'success'
        env:
          PYTHONPATH: src
        run: python -m stocktips dashboard-data

      - name: Record the run so the dashboard can show it
        if: always() && steps.run.outcome == 'success'
        env:
          PYTHONPATH: src
          DESK_COMMAND: ${{ inputs.command }}
          DESK_SYMBOL: ${{ inputs.symbol }}
          DESK_AMOUNT: ${{ inputs.amount }}
          DESK_ACTOR: ${{ github.actor }}
          DESK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/record_run.py /tmp/desk-output.txt

      - name: Commit and push
        if: always() && steps.run.outcome == 'success'
        run: |
          git config user.name  "desk (dashboard)"
          git config user.email "noreply@anthropic.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "no state change — nothing to commit"
            exit 0
          fi
          git add -A
          git commit -qm "desk: ${{ inputs.command }} ${{ inputs.symbol }}${{ inputs.amount }}" \
            -m "Dispatched from the dashboard by ${{ github.actor }}." \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          echo "::error::could not push the state change to main"
          exit 1

      - name: Show what the command said
        if: always()
        run: |
          echo '### `stocktips ${{ inputs.command }} ${{ inputs.symbol }}`' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -c 8000 /tmp/desk-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
